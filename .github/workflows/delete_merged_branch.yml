name: Delete Merged Branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete_merged_branch:
    runs-on: 'ubuntu-24.04'
    if: github.event.pull_request.merged == true && github.repository == github.event.pull_request.head.repo.full_name
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Delete branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" ]]; then
            echo "Skipping deletion of main or master branch"
          else
            if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME" > /dev/null; then
              echo "Deleting branch $BRANCH_NAME"
              git push origin --delete "$BRANCH_NAME"
            else
              remote_status=$?
              if [[ "$remote_status" -eq 2 ]]; then
                echo "Branch $BRANCH_NAME is already absent"
              else
                echo "::error::Unable to query branch $BRANCH_NAME from origin"
                exit "$remote_status"
              fi
            fi
          fi
